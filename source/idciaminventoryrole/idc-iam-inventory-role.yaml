AWSTemplateFormatVersion: "2010-09-09"
Description: "Create IAM role for IAM role inventory with read-only permissions, assumable by IdCInventoryAccessRole"

Parameters:
  TrustedAccountId:
    Type: String
    Description: AWS Account ID containing the AriaIdCInventoryAccessRole
  IAMRolesLambdaCrossAccountRole:
    Type: String
    Description: IAM role ARN of the GetIAMRoles Lambda in the hub account allowed to assume this role
    Default: "arn:aws:iam::<01234567890>:role/<stack-name>-GetIAMRolesLambdaExecutionRole-<randomchars>"
  TrustPoliciesLambdaCrossAccountRole:
    Type: String
    Description: IAM role ARN of the GetTrustPolicies Lambda in the hub account allowed to assume this role
    Default: "arn:aws:iam::<01234567890>:role/<stack-name>-GetTrustPoliciesExecutionRole-<randomchars>"

Resources:
  AriaIdCInventoryAccessRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: The Lambda function that will assume this role requires the ability to list all roles and all attached role policies in the AWS account
          - id: W28
            reason: The role name is set here so that it can be referenced in the main CloudFormation template without any user input
    Properties:
      RoleName: "AriaIdCInventoryAccessRole-LimitedReadOnly"
      Description: "Role for reading IdC IAM role information across accounts"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:PrincipalArn":
                  - !Ref IAMRolesLambdaCrossAccountRole
                  - !Ref TrustPoliciesLambdaCrossAccountRole
      Policies:
        - PolicyName: "AriaIdCInventoryAccessRole-LimitedReadOnlyPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read-only IAM actions. ListRoles/ListAttachedRolePolicies support the
              # base role inventory. GetPolicy/GetPolicyVersion/ListRolePolicies/GetRolePolicy
              # are additionally required by the chain-capability test (role_can_assume),
              # which reads each candidate role's attached and inline permission policies
              # under this assumed inventory role.
              # NOTE: This role is deployed per member account via StackSet. The updated
              # template must be redeployed to all member accounts before the
              # Chain_Capable_Roles source can populate rows - otherwise these reads fail
              # and every chain-capable role is silently classified as not chain-capable.
              - Effect: Allow
                Action:
                  - iam:ListRoles
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                Resource:
                  - "*"
      Tags:
        - Key: aria
          Value: role

Outputs:
  RoleARN:
    Description: "ARN of the created IAM role"
    Value: !GetAtt AriaIdCInventoryAccessRole.Arn

          - Effect: Allow
            Action:
              - "dynamodb:PutItem"
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdCUsers"
          - Effect: Allow
            Action:
              - "identitystore:ListUsers"
              - "sso:ListInstances"
            Resource: "*"
          - Effect: Allow
            Action:
              - "kms:DescribeKey"
              - "kms:Decrypt"
            Resource: !Sub arn:aws:kms:${AWS::Region}:${ManagementAccountId}:key/*
            Condition:
              StringEquals:

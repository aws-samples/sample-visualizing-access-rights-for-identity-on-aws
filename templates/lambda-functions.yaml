  # AccessAnalyzerPoller Lambda
  AccessAnalyzerPollerManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${S3SourceBucketName}/${AccessAnalyzerPollerS3Key}"
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-AccessAnalyzerPoller-function:*"
          # Cross-account assumption into the delegated administrator account's
          # poller role. Scoped to the specific role name/account rather than "*".
          - Effect: Allow
            Action:
              - "sts:AssumeRole"
            Resource: !Sub "arn:aws:iam::${DelegatedAdminAccountId}:role/${AccessAnalyzerPollerRoleName}"
          # The legacy poller handles internal and external families only.
          # Unused IAM-role findings use the separate dispatcher/worker roles
          # below so ListFindings and GetFinding remain independently scoped.
          - Effect: Allow
            Action:
              - "access-analyzer:ListFindings"
              - "access-analyzer:GetFinding"
            Resource:
              - !Ref InternalAccessAnalyzerArn
              - !Ref ExternalAccessAnalyzerArn
          # PutItem/DeleteItem are no longer called directly (reconcile_family
          # writes through table.batch_writer(), which issues BatchWriteItem),
          # but are kept here since batch_writer's own retry-of-UnprocessedItems
          # path and any direct single-item call remain permitted at no extra
          # privilege cost - both actions are already scoped to these three
          # tables and were previously granted for the same operations.
          - Effect: Allow
            Action:
              - "dynamodb:PutItem"
              - "dynamodb:DeleteItem"
              - "dynamodb:BatchWriteItem"
              - "dynamodb:Scan"
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdCInternalAAFindings"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdCUnusedAAFindings"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdCExternalAAFindings"
          # Read-only scan for tracked-role membership (Account Access Manager
          # entitlements), same permission the retired ingestion Lambda held.
          - Effect: Allow
            Action:
              - "dynamodb:Scan"
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdCAccountAccessAssignments"


AWSTemplateFormatVersion: "2010-09-09"
Description: "All Lambda functions for Workforce Identity Visualization"

Parameters:
  S3SourceBucketName:
    Type: String
  S3ExportBucketName:
    Type: String
  CreateTablesS3Key:
    Type: String
  ListUsersS3Key:
    Type: String
  ListGroupsS3Key:
    Type: String
  ListGroupMembershipS3Key:
    Type: String
  ListPermissionSetsS3Key:
    Type: String
  ListProvisionedPermissionSetsS3Key:
    Type: String
  ListAccountsS3Key:
    Type: String
  ListUserAccountAssignmentsS3Key:
    Type: String
  ListGroupAccountAssignmentsS3Key:
    Type: String
  GetIAMRolesS3Key:
    Type: String
  GetTrustPoliciesS3Key:
    Type: String
  ListAccountAccessAssignmentsS3Key:
    Type: String
  S3ExportS3Key:
    Type: String
  UpdateFunctionCodeS3Key:
    Type: String
  AccessAnalyzerPollerS3Key:
    Type: String
  PythonHandler:
    Type: String
  StackName:
    Type: String
  ManagementAccountId:
    Type: String
    Description: AWS Account ID of the Organizations management account (for KMS key access)
  InternalAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION_INTERNAL_ACCESS analyzer in the delegated administrator account
  ExternalAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION analyzer in the delegated administrator account
  UnusedAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION_UNUSED_ACCESS analyzer in the delegated administrator account
  DelegatedAdminAccountId:
    Type: String
    Description: AWS Account ID registered as the IAM Access Analyzer delegated administrator
  AccessAnalyzerPollerRoleName:
    Type: String
    Default: AriaAccessAnalyzerPollerRole
    Description: Name of the cross-account role in DelegatedAdminAccountId that this Lambda assumes
  AccessAnalyzerPollerMaxPollAttempts:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 50
    Description: >-
      Max Step Functions re-invocations per finding family per polling cycle
      while a family still has unfetched changed/new findings (each attempt
      is up to a 15-minute Lambda invocation). Raise temporarily for a large
      initial backfill (e.g. 20-30 for 10k+ findings on first run), then
      lower back to the default once the backlog is cleared.
  AccessAnalyzerPollerRequestsPerSecond:
    Type: Number
    Default: 0.5
    MinValue: 0.01
    Description: >-
      Fixed rate limit, in requests per second, applied between GetFindingV2
      calls while reconciling internal and external finding families (default
      0.5 RPS = 1 request every 2 seconds).
  AccessAnalyzerDispatcherRoleName:
    Type: String
    Default: AriaAccessAnalyzerDispatcherRole
    Description: Name of the cross-account delegated-admin role assumed by the unused-role dispatcher
  AccessAnalyzerWorkerRoleName:
    Type: String
    Default: AriaAccessAnalyzerWorkerRole
    Description: Name of the cross-account delegated-admin role assumed by the unused-role detail worker
  UnusedRoleWorkerRequestsPerSecond:
    Type: Number
    Default: 0.5
    MinValue: 0.01
    Description: >-
      Strict global GetFindingV2 rate limit for unused IAM-role findings. The
      SQS worker has one reserved concurrent execution and an event-source
      maximum concurrency of one, so this value applies account-wide.
  UnusedRoleWorkerBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10
    Description: Maximum SQS records delivered per unused-role worker invocation
  UnusedRoleQueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 600
    MinValue: 120
    MaxValue: 43200
    Description: SQS work-message visibility timeout, in seconds
  UnusedRoleQueueMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Receives before a failed unused-role work message is moved to the DLQ
  UnusedRoleDispatcherLeaseSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Lease duration that prevents overlapping unused-role dispatch runs
  RoleFilterIncludePermissionSets:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Include every IAM Identity Center permission-set role
  RoleFilterIncludeAamRoles:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Include every Account Access Manager role
  RoleFilterIncludeRoleNamePatterns:
    Type: String
    Default: "[]"
    Description: JSON array of shell-style IAM role-name patterns to include
  RoleFilterExcludeRoleNamePatterns:
    Type: String
    Default: "[]"
    Description: >-
      JSON array of shell-style IAM role-name patterns to exclude. A matching
      role is dropped even if it is a permission-set or AAM role or matches an
      include pattern.

Resources:
  # CreateTables Lambda
  CreateTablesManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${S3SourceBucketName}/${CreateTablesS3Key}"
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-CreateTables-function:*"
          - Effect: Allow
            Action:
              - "dynamodb:CreateTable"
              - "dynamodb:DeleteTable"
              - "dynamodb:UpdateTable"
              - "dynamodb:DescribeTable"
              - "dynamodb:ListTables"
              - "dynamodb:DescribeLimits"
              - "dynamodb:UpdateTimeToLive"
              - "dynamodb:DescribeTimeToLive"
              - "dynamodb:TagResource"
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AriaIdC*"

  CreateTablesRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref CreateTablesManagedPolicy
      Tags:
        - Key: aria
          Value: role
        - Key: auto-delete
          Value: "no"

  CreateTablesFunction:
    Type: "AWS::Lambda::Function"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC not required for this Lambda function accessing AWS services"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "DLQ not required for this Lambda function as it's invoked by Step Functions with built-in error handling"
          - id: CKV_AWS_173
            comment: "Default Lambda environment variable encryption is sufficient for this function"
          - id: CKV_AWS_117
            comment: "VPC not required for this Lambda function accessing AWS services"
    Properties:
      FunctionName: !Sub "${StackName}-CreateTables-function"
      Handler: !Ref PythonHandler
      Role: !GetAtt CreateTablesRole.Arn
      Code:
        S3Bucket: !Ref S3SourceBucketName
        S3Key: !Ref CreateTablesS3Key
      Runtime: python3.13
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          STACK_NAME: !Ref StackName
          PYTHON_PATH: "/var/task"
      TracingConfig:
        Mode: Active
      Architectures:
        - arm64
      ReservedConcurrentExecutions: 3
      Tags:
        - Key: aria
          Value: lambda
        - Key: auto-delete
          Value: "no"

  CreateTablesLogGroup:
    Type: "AWS::Logs::LogGroup"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Default CloudWatch Logs encryption is sufficient for this log group"
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Default CloudWatch Logs encryption is sufficient for this log group"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-CreateTables-function"
      RetentionInDays: 30
      Tags:
        - Key: aria
          Value: log
        - Key: auto-delete
          Value: "no"


      checkov:
        skip:
          - id: CKV_AWS_107
            comment: "IAM policy requires broad permissions for SSO and Identity Store operations, no credentials exposure risk"
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${S3SourceBucketName}/${ListUsersS3Key}"

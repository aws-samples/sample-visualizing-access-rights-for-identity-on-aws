          ROLE_FILTER_INCLUDE_AAM_ROLES: !Ref RoleFilterIncludeAamRoles
          ROLE_FILTER_INCLUDE_ROLE_NAME_PATTERNS: !Ref RoleFilterIncludeRoleNamePatterns
          ROLE_FILTER_EXCLUDE_ROLE_NAME_PATTERNS: !Ref RoleFilterExcludeRoleNamePatterns
          UNUSED_ROLE_WORK_QUEUE_URL: !Ref UnusedRoleWorkQueue
          UNUSED_ROLE_WORK_STATE_TABLE: !Ref UnusedRoleWorkStateTable
          UNUSED_ROLE_WORKER_RPS: !Ref UnusedRoleWorkerRequestsPerSecond
      TracingConfig:
        Mode: Active
      Architectures:
        - arm64
      ReservedConcurrentExecutions: 1
      Tags:
        - Key: aria
          Value: function
        - Key: auto-delete
          Value: "no"

  AccessAnalyzerUnusedWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Default CloudWatch Logs encryption is sufficient for this log group"
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Default CloudWatch Logs encryption is sufficient for this log group"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-AccessAnalyzerUnusedWorker-function"
      RetentionInDays: 30
      Tags:
        - Key: aria
          Value: log
        - Key: auto-delete
          Value: "no"

  AccessAnalyzerUnusedWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn:
      - AccessAnalyzerUnusedWorkerManagedPolicy
    Properties:
      EventSourceArn: !GetAtt UnusedRoleWorkQueue.Arn
      FunctionName: !Ref AccessAnalyzerUnusedWorkerFunction
      Enabled: true
      BatchSize: !Ref UnusedRoleWorkerBatchSize
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures
      # Reserved concurrency on the worker Lambda is one, which enforces the
      # strict global RPS without a conflicting event-source concurrency cap.

  # UpdateFunctionCode Lambda
  UpdateFunctionCodeManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${S3SourceBucketName}/*"
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-UpdateFunctionCode-function:*"
          - Effect: Allow
            Action:
              - "ssm:GetParameter*"
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/aria/lambda/*"
          - Effect: Allow
            Action:
              - "lambda:UpdateFunctionCode"
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*"

  UpdateFunctionCodeRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref UpdateFunctionCodeManagedPolicy
      Tags:
        - Key: aria
          Value: role
        - Key: auto-delete
          Value: "no"

  UpdateFunctionCodeFunction:
    Type: "AWS::Lambda::Function"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC not required for this Lambda function accessing AWS services"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "DLQ not required for this Lambda function as it's invoked by Step Functions with built-in error handling"
          - id: CKV_AWS_173
            comment: "Default Lambda environment variable encryption is sufficient for this function"
          - id: CKV_AWS_117
            comment: "VPC not required for this Lambda function accessing AWS services"
    Properties:
      FunctionName: !Sub "${StackName}-UpdateFunctionCode-function"
      Handler: !Ref PythonHandler
      Role: !GetAtt UpdateFunctionCodeRole.Arn
      Code:
        S3Bucket: !Ref S3SourceBucketName
        S3Key: !Ref UpdateFunctionCodeS3Key
      Runtime: python3.13
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          STACK_NAME: !Ref StackName
          PYTHON_PATH: "/var/task"
      TracingConfig:
        Mode: Active
      Architectures:
        - arm64
      ReservedConcurrentExecutions: 3
      Tags:
        - Key: aria
          Value: function
        - Key: auto-delete
          Value: "no"

  UpdateFunctionCodeLogGroup:
    Type: "AWS::Logs::LogGroup"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Default CloudWatch Logs encryption is sufficient for this log group"
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Default CloudWatch Logs encryption is sufficient for this log group"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-UpdateFunctionCode-function"
      RetentionInDays: 30
      Tags:
        - Key: aria
          Value: log
        - Key: auto-delete
          Value: "no"


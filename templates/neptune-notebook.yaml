---
Description: A template to deploy Neptune Notebooks using CloudFormation resources
Parameters:
  NotebookInstanceType:
    Type: String
  NotebookName:
    Type: String
  GraphPort:
    Description: Port to access your Analytics Graph.
    Type: String
  GraphVPC:
    Type: AWS::EC2::VPC::Id
  GraphSubnet:
    Type: AWS::EC2::Subnet::Id
  GraphSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  NeptuneGraphEndpoint:
    Type: String
    Description: Neptune Graph Endpoint from Neptune Analytics stack
  NeptuneGraphId:
    Type: String
    Description: Neptune Graph ID from Neptune Analytics stack
  NeptuneGraphName:
    Type: String
    Description: Neptune Graph Name from Neptune Analytics stack

Conditions:
  AddAnalyticsGraphVpc: !Not
    - !Equals
      - !Ref GraphVPC
      - ""
  AddAnalyticsGraphSubnet: !Not
    - !Equals
      - !Ref GraphSubnet
      - ""
  AddAnalyticsGraphSecurityGroup: !Not
    - !Equals
      - !Ref GraphSecurityGroup
      - ""
  AddNetworkOptions: !And
    - !Condition AddAnalyticsGraphVpc
    - !Condition AddAnalyticsGraphSubnet
  CreateSagemakerSecurityGroup: !And
    - !Condition AddNetworkOptions
    - !Not
      - !Condition AddAnalyticsGraphSecurityGroup
  IsIadRegion: !Equals
    - !Ref AWS::Region
    - us-east-1

Resources:
  SageMakerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Required for Neptune to function
    Condition: CreateSagemakerSecurityGroup
    Properties:
      GroupDescription: Allow Access
      VpcId: !Ref GraphVPC
      SecurityGroupEgress:
        - Description: Allow HTTPS traffic outbound
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub Neptune-Analytics
        - Key: StackId
          Value: !Sub ${AWS::StackId}
        - Key: Stack
          Value: !Sub ${AWS::Region}-${AWS::StackName}
        - Key: Application
          Value: NeptuneCloudformation
        - Key: aria
          Value: securitygroup
        - Key: auto-delete
          Value: "no"

  NeptuneAnalyticsNotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    #checkov:skip=CKV_AWS_187:This is an example notebook instance kmskeyid and associated KMS key would be created to run in production
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W1201
            reason: This is an example notebook instance kmskeyid and associated KMS key would be created to run in production
    Properties:
      InstanceType: !Ref NotebookInstanceType
      PlatformIdentifier: notebook-al2023-v1
      NotebookInstanceName: !Join
        - ""
        - - aws-neptune-analytics-
          - !Ref NotebookName
      SubnetId: !If
        - AddNetworkOptions
        - !Ref GraphSubnet
        - !Ref AWS::NoValue
      SecurityGroupIds: !If
        - AddNetworkOptions
        - !If
          - AddAnalyticsGraphSecurityGroup
          - - !Ref GraphSecurityGroup
          - - !GetAtt SageMakerSecurityGroup.GroupId
        - !Ref AWS::NoValue
      RoleArn: !GetAtt ExecutionRole.Arn
      LifecycleConfigName: !GetAtt NeptuneAnalyticsNotebookInstanceLifecycleConfig.NotebookInstanceLifecycleConfigName
      Tags:
        - Key: StackId
          Value: !Sub ${AWS::StackId}
        - Key: Stack
          Value: !Sub ${AWS::Region}-${AWS::StackName}
        - Key: Application
          Value: NeptuneCloudformation
        - Key: aws-neptune-analytics-graph-endpoint
          Value: !Ref NeptuneGraphEndpoint
        - Key: aws-neptune-graph-name
          Value: !Ref NeptuneGraphName
        - Key: aws-neptune-graph-id
          Value: !Ref NeptuneGraphId
        - Key: aria
          Value: notebookinstance
        - Key: auto-delete
          Value: "no"

  NeptuneAnalyticsNotebookInstanceLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Properties:
      OnStart:
        - Content:
            Fn::Base64: !Sub
              - |
                #!/bin/bash

                sudo -u ec2-user -i <<'EOF'

                echo "export GRAPH_NOTEBOOK_AUTH_MODE=IAM" >> ~/.bashrc
                echo "export GRAPH_NOTEBOOK_SSL=True" >> ~/.bashrc
                echo "export GRAPH_NOTEBOOK_SERVICE=neptune-graph" >> ~/.bashrc
                echo "export GRAPH_NOTEBOOK_HOST=${NeptuneGraphEndpoint}" >> ~/.bashrc
                echo "export GRAPH_NOTEBOOK_PORT=${GraphPort}" >> ~/.bashrc
                echo "export NEPTUNE_LOAD_FROM_S3_ROLE_ARN=" >> ~/.bashrc
                echo "export AWS_REGION=${AWS::Region}" >> ~/.bashrc

                EXPLORER_VERSION=""
                NOTEBOOK_VERSION=""

                source activate JupyterSystemEnv

                echo "installing Python 3 kernel"
                python3 -m ipykernel install --sys-prefix --name python3 --display-name "Python 3"

                echo "installing python dependencies..."
                pip uninstall NeptuneGraphNotebook -y # legacy uninstall when we used to install from source in s3

                pip install "jupyter_core<=5.3.2"
                pip install "jupyter_server<=2.7.3"
                pip install "jupyter-console<=6.4.0"
                pip install "jupyter-client<=6.1.12"
                pip install "ipywidgets==7.7.2"
                pip install "jupyterlab_widgets==1.1.1"
                pip install "notebook==6.4.12"
                pip install "nbclient<=0.7.0"
                pip install awswrangler

                if [[ ${!NOTEBOOK_VERSION} == "" ]]; then
                  pip install --upgrade graph-notebook
                else
                  pip install --upgrade graph-notebook==${!NOTEBOOK_VERSION}
                fi

                echo "installing nbextensions..."
                python -m graph_notebook.nbextensions.install

                echo "installing static resources..."
                python -m graph_notebook.static_resources.install

                echo "enabling visualization..."
                NOTEBOOK_VERSION_NUM=$(echo "${!NOTEBOOK_VERSION}" | tr -d '.')
                if [[ ${!NOTEBOOK_VERSION_NUM} < 330 ]] && [[ ${!NOTEBOOK_VERSION} != "" ]]; then
                  jupyter nbextension install --py --sys-prefix graph_notebook.widgets
                fi
                jupyter nbextension enable  --py --sys-prefix graph_notebook.widgets

                mkdir -p ~/SageMaker/Neptune
                cd ~/SageMaker/Neptune || exit
                python -m graph_notebook.notebooks.install
                chmod -R a+rw ~/SageMaker/Neptune/*

                source ~/.bashrc || exit
                HOST=${!GRAPH_NOTEBOOK_HOST}
                PORT=${!GRAPH_NOTEBOOK_PORT}
                SERVICE=${!GRAPH_NOTEBOOK_SERVICE}
                AUTH_MODE=${!GRAPH_NOTEBOOK_AUTH_MODE}
                SSL=${!GRAPH_NOTEBOOK_SSL}
                LOAD_FROM_S3_ARN=${!NEPTUNE_LOAD_FROM_S3_ROLE_ARN}

                if [[ ${!SSL} -eq "" ]]; then
                  SSL="True"
                fi

                echo "Creating config with
                HOST:                       ${!HOST}
                PORT:                       ${!PORT}
                SERVICE:                    ${!SERVICE}
                AUTH_MODE:                  ${!AUTH_MODE}
                SSL:                        ${!SSL}
                AWS_REGION:                 ${!AWS_REGION}"

                /home/ec2-user/anaconda3/envs/JupyterSystemEnv/bin/python -m graph_notebook.configuration.generate_config \
                  --host "${!HOST}" \
                  --port "${!PORT}" \
                  --neptune_service "${!SERVICE}" \
                  --auth_mode "${!AUTH_MODE}" \
                  --ssl "${!SSL}" \
                  --load_from_s3_arn "${!LOAD_FROM_S3_ARN}" \
                  --aws_region "${!AWS_REGION}"

                echo "Adding graph_notebook.magics to ipython config..."
                if [[ ${!NOTEBOOK_VERSION_NUM} > 341 ]] || [[ ${!NOTEBOOK_VERSION} == "" ]]; then
                  /home/ec2-user/anaconda3/envs/JupyterSystemEnv/bin/python -m graph_notebook.ipython_profile.configure_ipython_profile
                else
                  echo "Skipping, unsupported on graph-notebook<=3.4.1"
                fi

                echo "graph-notebook installation complete."

                echo "Constructing explorer connection configuration..."

                GRAPH_NOTEBOOK_NAME=$(jq '.ResourceName' /opt/ml/metadata/resource-metadata.json --raw-output)
                echo "Grabbed notebook name: ${!GRAPH_NOTEBOOK_NAME}"

                GRAPH_NOTEBOOK_DESCRIBE_OUTPUT=$(aws sagemaker describe-notebook-instance --notebook-instance-name ${!GRAPH_NOTEBOOK_NAME} --region ${!AWS_REGION})
                if [ -z "$GRAPH_NOTEBOOK_DESCRIBE_OUTPUT" ]; then
                  echo "DescribeNotebookInstance failed. Manually building Notebook URL from name."
                  if [[ ${!AWS_REGION} == "cn-north-1" || ${!AWS_REGION} == "cn-northwest-1" ]]; then
                    AWS_DOMAIN=com.cn
                  else
                    AWS_DOMAIN=aws
                  fi
                  EXPLORER_URI="https://${!GRAPH_NOTEBOOK_NAME}.notebook.${!AWS_REGION}.sagemaker.${!AWS_DOMAIN}/proxy/9250"
                else
                  GRAPH_NOTEBOOK_URL=$(echo "$GRAPH_NOTEBOOK_DESCRIBE_OUTPUT" | jq -r 'try .Url catch empty')
                  echo "Notebook URL from DescribeNotebookInstance: ${!GRAPH_NOTEBOOK_URL}"
                  EXPLORER_URI="https://${!GRAPH_NOTEBOOK_URL}/proxy/9250"
                fi

                NEPTUNE_URI="https://${!GRAPH_NOTEBOOK_HOST}:${!GRAPH_NOTEBOOK_PORT}"
                AWS_REGION=${!AWS_REGION}
                echo "AUTH_MODE from Lifecycle: ${!GRAPH_NOTEBOOK_AUTH_MODE}"
                if [[ ${!GRAPH_NOTEBOOK_AUTH_MODE} == "IAM" ]]; then
                  IAM=true
                else
                  IAM=false
                fi

                echo "Explorer URI: ${!EXPLORER_URI}"
                echo "Neptune URI: ${!NEPTUNE_URI}"
                echo "Explorer region: ${!AWS_REGION}"
                echo "Explorer IAM auth mode: ${!IAM}"

                ECR_TOKEN=$(curl -k https://public.ecr.aws/token/ | jq -r '.token')
                LATEST_ECR_RELEASE=$(curl -k -H "Authorization: Bearer $ECR_TOKEN" https://public.ecr.aws/v2/neptune/graph-explorer/tags/list | jq -r '.tags | sort_by(split(".") | try map(tonumber) catch [0,0,0])[-1]')

                echo "Pulling and starting graph-explorer..."
                EXPLORER_VERSION_NUM=$(echo "${!EXPLORER_VERSION}" | tr -d '.')
                if [[ ${!EXPLORER_VERSION} == "" ]]; then
                  EXPLORER_ECR_TAG=sagemaker-${!LATEST_ECR_RELEASE}
                else
                  if [[ ${!EXPLORER_VERSION_NUM} -ge 140 ]]; then
                    EXPLORER_ECR_TAG=sagemaker-${!EXPLORER_VERSION}
                  elif [[ ${!EXPLORER_VERSION} == *latest* ]]; then
                    EXPLORER_ECR_TAG=sagemaker-latest-SNAPSHOT
                  elif [[ ${!EXPLORER_VERSION} == *dev* ]]; then
                    EXPLORER_ECR_TAG=sagemaker-dev
                  else
                    echo "Specified Graph Explorer version does not support use on SageMaker. Defaulting to latest release."
                    EXPLORER_ECR_TAG=sagemaker-${!LATEST_ECR_RELEASE}
                  fi
                fi
                echo "Using explorer image tag: ${!EXPLORER_ECR_TAG}"

                start_graph_explorer_with_cw_logs() {
                    docker run -d -p 9250:9250 \
                      --restart always \
                      --log-driver=awslogs \
                      --log-opt awslogs-region=${!AWS_REGION} \
                      --log-opt awslogs-group=/aws/sagemaker/NotebookInstances \
                      --log-opt awslogs-stream=${!GRAPH_NOTEBOOK_NAME}/graph-explorer.log \
                      --log-opt awslogs-multiline-pattern='^(INFO|DEBUG|ERROR|WARN|TRACE|FATAL)' \
                      --env LOG_LEVEL=debug \
                      --env HOST=127.0.0.1 \
                      --env PUBLIC_OR_PROXY_ENDPOINT=${!EXPLORER_URI} \
                      --env GRAPH_CONNECTION_URL=${!NEPTUNE_URI} \
                      --env USING_PROXY_SERVER=true \
                      --env IAM=${!IAM} \
                      --env AWS_REGION=${!AWS_REGION} \
                      --env SERVICE_TYPE=${!SERVICE} \
                      --env PROXY_SERVER_HTTPS_CONNECTION=false \
                      --env NEPTUNE_NOTEBOOK=true public.ecr.aws/neptune/graph-explorer:${!EXPLORER_ECR_TAG}
                }

                start_graph_explorer_with_default_logs() {
                    docker run -d -p 9250:9250 \
                      --restart always \
                      --env LOG_LEVEL=debug \
                      --env HOST=127.0.0.1 \
                      --env PUBLIC_OR_PROXY_ENDPOINT=${!EXPLORER_URI} \
                      --env GRAPH_CONNECTION_URL=${!NEPTUNE_URI} \
                      --env USING_PROXY_SERVER=true \
                      --env IAM=${!IAM} \
                      --env AWS_REGION=${!AWS_REGION} \
                      --env SERVICE_TYPE=${!SERVICE} \
                      --env PROXY_SERVER_HTTPS_CONNECTION=false \
                      --env NEPTUNE_NOTEBOOK=true public.ecr.aws/neptune/graph-explorer:${!EXPLORER_ECR_TAG}
                }

                output=$(start_graph_explorer_with_cw_logs 2>&1)
                exit_status=$?

                if [[ $exit_status -ne 0 ]]; then
                  if [[ "$output" == *"logging driver"* ]]; then
                    echo "Failed to start Graph Explorer Docker container with AWS log driver. Please check that your notebook has sufficient CloudWatch IAM permissions."
                    echo "Retrying with default JSON file logging driver..."
                    start_graph_explorer_with_default_logs
                  else
                    echo "$output"
                    exit 1
                  fi
                fi

                echo "Graph Explorer installation done."

                conda /home/ec2-user/anaconda3/bin/deactivate
                echo "done."

                EOF

              - NeptuneGraphEndpoint: !Ref NeptuneGraphEndpoint
                GraphPort: !Ref GraphPort
                NeptuneNoteBookCopy:
                  !If [
                    "IsIadRegion",
                    "aws-neptune-notebook",
                    !Sub "aws-neptune-notebook-${AWS::Region}",
                  ]

  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F3
            reason: This is a role assumed by SageMaker and is not used by an end user
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SagemakerNotebookNeptuneAnalyticsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*
              - Effect: Allow
                Action: neptune-graph:*
                Resource: !Sub arn:aws:neptune-graph:${AWS::Region}:${AWS::AccountId}:*/*
              - Effect: Allow
                Action: sagemaker:DescribeNotebookInstance
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*
      Tags:
        - Key: aria
          Value: role
        - Key: auto-delete
          Value: "no"

Outputs:
  NeptuneAnalyticsNotebookInstanceId:
    Value: !Ref NeptuneAnalyticsNotebookInstance
  NeptuneAnalyticsNotebookName:
    Value: !GetAtt NeptuneAnalyticsNotebookInstance.NotebookInstanceName
  NeptuneAnalyticsSagemakerNotebook:
    Value: !Join
      - ""
      - - https://
        - !Select
          - 1
          - !Split
            - /
            - !Ref NeptuneAnalyticsNotebookInstance
        - .notebook.
        - !Ref AWS::Region
        - .sagemaker.aws/
  NotebookGraphExplorerURL:
    Value: !Join
      - ""
      - - https://
        - !Select
          - 1
          - !Split
            - /
            - !Ref NeptuneAnalyticsNotebookInstance
        - .notebook.
        - !Ref AWS::Region
        - .sagemaker.aws/proxy/9250/explorer/
  NeptuneAnalyticsNotebookInstanceLifecycleConfigId:
    Value: !Ref NeptuneAnalyticsNotebookInstanceLifecycleConfig

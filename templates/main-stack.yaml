AWSTemplateFormatVersion: "2010-09-09"
Description: "Main CloudFormation template for Workforce Identity Visualization - orchestrates nested stacks (uksb-zilgml23n9)"

Parameters:
  S3SourceBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of the SSM parameter containing the S3 bucket with all Lambda function source code
    Default: "aria-source-bucket"

  S3ExportBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of the SSM parameter containing the S3 bucket to export all data to
    Default: "aria-export-bucket"

  CreateTablesS3Key:
    Type: String
    Description: S3 key (path) to the CreateTables Lambda function code zip file
    Default: "createtables.zip"

  ListUsersS3Key:
    Type: String
    Description: S3 key (path) to the ListUsers Lambda function code zip file
    Default: "listusers.zip"

  ListGroupsS3Key:
    Type: String
    Description: S3 key (path) to the ListGroups Lambda function code zip file
    Default: "listgroups.zip"

  ListGroupMembershipS3Key:
    Type: String
    Description: S3 key (path) to the ListGroupMembership Lambda function code zip file
    Default: "listgroupmembership.zip"

  ListPermissionSetsS3Key:
    Type: String
    Description: S3 key (path) to the ListPermissionSets Lambda function code zip file
    Default: "listpermissionsets.zip"

  ListProvisionedPermissionSetsS3Key:
    Type: String
    Description: S3 key (path) to the ListProvisionedPermissionSets Lambda function code zip file
    Default: "listprovisionedpermissionsets.zip"

  ListAccountsS3Key:
    Type: String
    Description: S3 key (path) to the ListAccounts Lambda function code zip file
    Default: "listaccounts.zip"

  ListUserAccountAssignmentsS3Key:
    Type: String
    Description: S3 key (path) to the ListUserAccountAssignments Lambda function code zip file
    Default: "listuseraccountassignments.zip"

  ListGroupAccountAssignmentsS3Key:
    Type: String
    Description: S3 key (path) to the ListGroupAccountAssignments Lambda function code zip file
    Default: "listgroupaccountassignments.zip"

  GetIAMRolesS3Key:
    Type: String
    Description: S3 key (path) to the GetIAMRoles Lambda function code zip file
    Default: "getiamroles.zip"

  GetTrustPoliciesS3Key:
    Type: String
    Description: S3 key (path) to the GetTrustPolicies Lambda function code zip file
    Default: "gettrustpolicies.zip"

  ListAccountAccessAssignmentsS3Key:
    Type: String
    Description: S3 key (path) to the ListAccountAccessAssignments Lambda function code zip file
    Default: "listaccountaccessassignments.zip"

  S3ExportS3Key:
    Type: String
    Description: S3 key (path) to the S3Export Lambda function code zip file
    Default: "s3export.zip"

  UpdateFunctionCodeS3Key:
    Type: String
    Description: S3 key (path) to the UpdateFunctionCode Lambda function code zip file
    Default: "updatefunctioncode.zip"

  PythonHandler:
    Type: String
    Description: The Python handler function
    Default: lambda_function.lambda_handler

  TemplatesBucketName:
    Type: String
    Description: S3 bucket containing nested CloudFormation templates
    Default: "aria-templates-bucket"

  # Neptune Analytics Parameters
  GraphName:
    Type: String
    Description: "Name of the Neptune graph"
    Default: "aria-identitycenter"

  PublicIPAddress:
    Type: String
    Description: Provide your public IP address in CIDR format e.g. 1.2.3.4/32
    Default: "0.0.0.0/0"

  # Neptune Notebook Parameters
  NotebookInstanceType:
    Type: String
    Description: SageMaker Notebook instance type
    Default: ml.t2.large
    AllowedValues:
      - ml.t2.medium
      - ml.t2.large
      - ml.t2.xlarge
      - ml.t2.2xlarge
      - ml.t3.medium
      - ml.t3.large
      - ml.t3.xlarge
      - ml.t3.2xlarge
      - ml.m4.xlarge
      - ml.m4.2xlarge
      - ml.m4.4xlarge
      - ml.m4.10xlarge
      - ml.m4.16xlarge
      - ml.m5.xlarge
      - ml.m5.2xlarge
      - ml.m5.4xlarge
      - ml.m5.12xlarge
      - ml.m5.24xlarge

  NotebookName:
    Type: String
    Description: Name for the notebook instance
    Default: "Aria-Jupyter-Notebook"
    MaxLength: 38

  DeployNeptune:
    Type: String
    Description: Whether to deploy the Neptune Analytics graph
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  DeployNeptuneNotebook:
    Type: String
    Description: >-
      Whether to deploy the Neptune (SageMaker) notebook and Graph Explorer.
      Requires DeployNeptune=true.
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  # MCP Server (AgentCore) Parameters
  DeployMcpServer:
    Type: String
    Description: >-
      Whether to host the ARIA-gv MCP server on Bedrock AgentCore Runtime.
      Requires DeployNeptune=true and a pre-built image (McpContainerImageUri).
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  McpContainerImageUri:
    Type: String
    Description: >-
      ECR image URI (with tag) of the ARM64 MCP server image. Build it first
      with mcp-server/build-and-push.sh. Required when DeployMcpServer=true.
    Default: ""

  McpAgentRuntimeName:
    Type: String
    Description: "Name for the AgentCore Runtime (letters, numbers, underscores only)"
    Default: "aria_gv_mcp"
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,47}$"

  McpRuntimeSubnet1AzId:
    Type: String
    Description: >-
      AZ ID for the first MCP runtime subnet. Must be an AgentCore-supported AZ.
      Default is for us-east-1; override for other regions.
    Default: "use1-az1"

  McpRuntimeSubnet2AzId:
    Type: String
    Description: >-
      AZ ID for the second MCP runtime subnet. Must be an AgentCore-supported AZ.
      Default is for us-east-1; override for other regions.
    Default: "use1-az2"

  McpAccessTokenValidityHours:
    Type: Number
    Description: "Cognito access token lifetime in hours for the MCP M2M client (1-24)"
    Default: 12
    MinValue: 1
    MaxValue: 24

  # Scheduling Parameters
  EnableScheduling:
    Type: String
    Description: Enable automatic scheduling of the AriaExportGraphStateMachine
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  ScheduleExpression:
    Type: String
    Description: "Schedule expression for automatic execution (e.g., rate(1 day), cron(0 2 * * ? *))"
    Default: "rate(1 day)"

  ScheduleDescription:
    Type: String
    Description: "Description for the scheduled execution"
    Default: "Daily execution of ARIA graph export and import"

  ScheduleTimezone:
    Type: String
    Description: "Timezone for cron-based schedules (e.g., America/New_York, UTC)"
    Default: "UTC"

  # Data Collection Scheduling Parameters
  EnableDataCollectionScheduling:
    Type: String
    Description: Enable automatic scheduling of the AriaStateMachine for data collection
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  DataCollectionScheduleExpression:
    Type: String
    Description: "Schedule expression for automatic data collection (e.g., rate(6 hours), cron(0 */6 * * ? *))"
    Default: "rate(6 hours)"

  DataCollectionScheduleDescription:
    Type: String
    Description: "Description for the scheduled data collection execution"
    Default: "Automated ARIA identity data collection every 6 hours"

  DataCollectionScheduleTimezone:
    Type: String
    Description: "Timezone for cron-based schedules (e.g., America/New_York, UTC)"
    Default: "UTC"

  ManagementAccountId:
    Type: String
    Description: "AWS Account ID of the Organizations management account (for KMS key access)"

  AccessAnalyzerPollerS3Key:
    Type: String
    Description: S3 key (path) to the AccessAnalyzerPoller Lambda function code zip file
    Default: "accessanalyzerpoller.zip"

  InternalAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION_INTERNAL_ACCESS analyzer in the delegated administrator account

  ExternalAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION analyzer in the delegated administrator account

  UnusedAccessAnalyzerArn:
    Type: String
    Description: ARN of the ORGANIZATION_UNUSED_ACCESS analyzer in the delegated administrator account

  DelegatedAdminAccountId:
    Type: String
    Description: AWS Account ID registered as the IAM Access Analyzer delegated administrator

  AccessAnalyzerPollerRoleName:
    Type: String
    Description: Name of the cross-account role in DelegatedAdminAccountId that this Lambda assumes
    Default: AriaAccessAnalyzerPollerRole

  AccessAnalyzerPollerMaxPollAttempts:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 50
    Description: >-
      Max Step Functions re-invocations per finding family per polling cycle
      while a family still has unfetched changed/new findings. Raise
      temporarily for a large initial backfill (e.g. 20-30 for 10k+ findings
      on first run), then lower back to the default once the backlog clears.

  AccessAnalyzerPollerRequestsPerSecond:
    Type: Number
    Default: 0.5
    MinValue: 0.01
    Description: >-
      Fixed rate limit, in requests per second, applied between GetFindingV2
      calls while reconciling internal and external finding families (default
      0.5 RPS = 1 request every 2 seconds).

  AccessAnalyzerDispatcherRoleName:
    Type: String
    Default: AriaAccessAnalyzerDispatcherRole
    Description: Name of the cross-account role assumed by the unused-role dispatcher

  AccessAnalyzerWorkerRoleName:
    Type: String
    Default: AriaAccessAnalyzerWorkerRole
    Description: Name of the cross-account role assumed by the unused-role detail worker

  UnusedRoleWorkerRequestsPerSecond:
    Type: Number
    Default: 0.5
    MinValue: 0.01
    Description: >-
      Strict global GetFindingV2 rate limit for queued unused IAM-role
      findings. The SQS worker always has one concurrent execution.

  UnusedRoleWorkerBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10
    Description: Maximum SQS messages delivered per unused-role worker invocation

  UnusedRoleQueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 600
    MinValue: 120
    MaxValue: 43200
    Description: SQS work-message visibility timeout, in seconds

  UnusedRoleQueueMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Receives before a failed unused-role work message moves to the DLQ

  UnusedRoleDispatcherLeaseSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Lease duration that prevents overlapping unused-role dispatch runs

  RoleFilterIncludePermissionSets:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Include every IAM Identity Center permission-set role

  RoleFilterIncludeAamRoles:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Include every Account Access Manager role

  RoleFilterIncludeRoleNamePatterns:
    Type: String
    Default: "[]"
    Description: JSON array of shell-style IAM role-name patterns to include

  RoleFilterExcludeRoleNamePatterns:
    Type: String
    Default: "[]"
    Description: >-
      JSON array of shell-style IAM role-name patterns to exclude. A matching
      role is dropped even if it is a permission-set or AAM role or matches an
      include pattern.

  # Access Analyzer Scheduling Parameters - the AriaAccessAnalyzerStateMachine
  # runs on its own schedule, independent of AriaStateMachine's identity data
  # collection, so Access Analyzer findings can be polled more frequently.
  EnableAccessAnalyzerScheduling:
    Type: String
    Description: Enable automatic scheduling of the AriaAccessAnalyzerStateMachine
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  AccessAnalyzerScheduleExpression:
    Type: String
    Description: "Schedule expression for automatic Access Analyzer polling (e.g., rate(15 minutes), cron(0/15 * * * ? *))"
    Default: "rate(15 minutes)"

  AccessAnalyzerScheduleDescription:
    Type: String
    Description: "Description for the scheduled Access Analyzer polling execution"
    Default: "Automated ARIA Access Analyzer findings polling every 15 minutes"

  AccessAnalyzerScheduleTimezone:
    Type: String
    Description: "Timezone for cron-based schedules (e.g., America/New_York, UTC)"
    Default: "UTC"

Conditions:
  ShouldDeployNeptune: !Equals [!Ref DeployNeptune, "true"]
  ShouldDeployNeptuneNotebook: !And
    - !Equals [!Ref DeployNeptune, "true"]
    - !Equals [!Ref DeployNeptuneNotebook, "true"]
  ShouldDeployNeptuneWithScheduling: !And
    - !Equals [!Ref DeployNeptune, "true"]
    - !Equals [!Ref EnableScheduling, "true"]
  ShouldDeployMcpServer: !And
    - !Equals [!Ref DeployNeptune, "true"]
    - !Equals [!Ref DeployMcpServer, "true"]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "S3 Bucket SSM Parameters"
        Parameters:
          - S3SourceBucketName
          - S3ExportBucketName
          - TemplatesBucketName
      - Label:
          default: "Lambda Functions"
        Parameters:
          - CreateTablesS3Key
          - ListUsersS3Key
          - ListGroupsS3Key
          - ListGroupMembershipS3Key
          - ListPermissionSetsS3Key
          - ListProvisionedPermissionSetsS3Key
          - ListAccountsS3Key
          - ListUserAccountAssignmentsS3Key
          - ListGroupAccountAssignmentsS3Key
          - GetIAMRolesS3Key
          - GetTrustPoliciesS3Key
          - ListAccountAccessAssignmentsS3Key
          - S3ExportS3Key
          - UpdateFunctionCodeS3Key
      - Label:
          default: "Access Analyzer Poller"
        Parameters:
          - AccessAnalyzerPollerS3Key
          - InternalAccessAnalyzerArn
          - ExternalAccessAnalyzerArn
          - UnusedAccessAnalyzerArn
          - DelegatedAdminAccountId
          - AccessAnalyzerPollerRoleName
          - AccessAnalyzerPollerMaxPollAttempts
          - AccessAnalyzerPollerRequestsPerSecond
          - AccessAnalyzerDispatcherRoleName
          - AccessAnalyzerWorkerRoleName
          - UnusedRoleWorkerRequestsPerSecond
          - UnusedRoleWorkerBatchSize
          - UnusedRoleQueueVisibilityTimeoutSeconds
          - UnusedRoleQueueMaxReceiveCount
          - UnusedRoleDispatcherLeaseSeconds
      - Label:
          default: "Role Filtering"
        Parameters:
          - RoleFilterIncludePermissionSets
          - RoleFilterIncludeAamRoles
          - RoleFilterIncludeRoleNamePatterns
          - RoleFilterExcludeRoleNamePatterns
      - Label:
          default: "Python Handler"
        Parameters:
          - PythonHandler
      - Label:
          default: "Neptune Analytics"
        Parameters:
          - DeployNeptune
          - GraphName
          - PublicIPAddress
      - Label:
          default: "Neptune Notebook"
        Parameters:
          - DeployNeptuneNotebook
          - NotebookInstanceType
          - NotebookName
      - Label:
          default: "MCP Server (AgentCore)"
        Parameters:
          - DeployMcpServer
          - McpContainerImageUri
          - McpAgentRuntimeName
          - McpRuntimeSubnet1AzId
          - McpRuntimeSubnet2AzId
          - McpAccessTokenValidityHours
      - Label:
          default: "Graph Export Scheduling"
        Parameters:
          - EnableScheduling
          - ScheduleExpression
          - ScheduleDescription
          - ScheduleTimezone
      - Label:
          default: "Data Collection Scheduling"
        Parameters:
          - EnableDataCollectionScheduling
          - DataCollectionScheduleExpression
          - DataCollectionScheduleDescription
          - DataCollectionScheduleTimezone
      - Label:
          default: "Access Analyzer Scheduling"
        Parameters:
          - EnableAccessAnalyzerScheduling
          - AccessAnalyzerScheduleExpression
          - AccessAnalyzerScheduleDescription
          - AccessAnalyzerScheduleTimezone

Resources:
  # Lambda Functions Stack
  LambdaStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/lambda-functions.yaml"
      Parameters:
        S3SourceBucketName: !Ref S3SourceBucketName
        S3ExportBucketName: !Ref S3ExportBucketName
        CreateTablesS3Key: !Ref CreateTablesS3Key
        ListUsersS3Key: !Ref ListUsersS3Key
        ListGroupsS3Key: !Ref ListGroupsS3Key
        ListGroupMembershipS3Key: !Ref ListGroupMembershipS3Key
        ListPermissionSetsS3Key: !Ref ListPermissionSetsS3Key
        ListProvisionedPermissionSetsS3Key: !Ref ListProvisionedPermissionSetsS3Key
        ListAccountsS3Key: !Ref ListAccountsS3Key
        ListUserAccountAssignmentsS3Key: !Ref ListUserAccountAssignmentsS3Key
        ListGroupAccountAssignmentsS3Key: !Ref ListGroupAccountAssignmentsS3Key
        GetIAMRolesS3Key: !Ref GetIAMRolesS3Key
        GetTrustPoliciesS3Key: !Ref GetTrustPoliciesS3Key
        ListAccountAccessAssignmentsS3Key: !Ref ListAccountAccessAssignmentsS3Key
        S3ExportS3Key: !Ref S3ExportS3Key
        UpdateFunctionCodeS3Key: !Ref UpdateFunctionCodeS3Key
        PythonHandler: !Ref PythonHandler
        StackName: !Ref AWS::StackName
        ManagementAccountId: !Ref ManagementAccountId
        AccessAnalyzerPollerS3Key: !Ref AccessAnalyzerPollerS3Key
        InternalAccessAnalyzerArn: !Ref InternalAccessAnalyzerArn
        ExternalAccessAnalyzerArn: !Ref ExternalAccessAnalyzerArn
        UnusedAccessAnalyzerArn: !Ref UnusedAccessAnalyzerArn
        DelegatedAdminAccountId: !Ref DelegatedAdminAccountId
        AccessAnalyzerPollerRoleName: !Ref AccessAnalyzerPollerRoleName
        AccessAnalyzerPollerMaxPollAttempts: !Ref AccessAnalyzerPollerMaxPollAttempts
        AccessAnalyzerPollerRequestsPerSecond: !Ref AccessAnalyzerPollerRequestsPerSecond
        AccessAnalyzerDispatcherRoleName: !Ref AccessAnalyzerDispatcherRoleName
        AccessAnalyzerWorkerRoleName: !Ref AccessAnalyzerWorkerRoleName
        UnusedRoleWorkerRequestsPerSecond: !Ref UnusedRoleWorkerRequestsPerSecond
        UnusedRoleWorkerBatchSize: !Ref UnusedRoleWorkerBatchSize
        UnusedRoleQueueVisibilityTimeoutSeconds: !Ref UnusedRoleQueueVisibilityTimeoutSeconds
        UnusedRoleQueueMaxReceiveCount: !Ref UnusedRoleQueueMaxReceiveCount
        UnusedRoleDispatcherLeaseSeconds: !Ref UnusedRoleDispatcherLeaseSeconds
        RoleFilterIncludePermissionSets: !Ref RoleFilterIncludePermissionSets
        RoleFilterIncludeAamRoles: !Ref RoleFilterIncludeAamRoles
        RoleFilterIncludeRoleNamePatterns: !Ref RoleFilterIncludeRoleNamePatterns
        RoleFilterExcludeRoleNamePatterns: !Ref RoleFilterExcludeRoleNamePatterns
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # SSM Parameters Stack
  SSMStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/ssm-stack.yaml"
      Parameters:
        CreateTablesS3Key: !Ref CreateTablesS3Key
        ListUsersS3Key: !Ref ListUsersS3Key
        ListGroupsS3Key: !Ref ListGroupsS3Key
        ListGroupMembershipS3Key: !Ref ListGroupMembershipS3Key
        ListPermissionSetsS3Key: !Ref ListPermissionSetsS3Key
        ListProvisionedPermissionSetsS3Key: !Ref ListProvisionedPermissionSetsS3Key
        ListAccountsS3Key: !Ref ListAccountsS3Key
        ListUserAccountAssignmentsS3Key: !Ref ListUserAccountAssignmentsS3Key
        ListGroupAccountAssignmentsS3Key: !Ref ListGroupAccountAssignmentsS3Key
        GetIAMRolesS3Key: !Ref GetIAMRolesS3Key
        ListAccountAccessAssignmentsS3Key: !Ref ListAccountAccessAssignmentsS3Key
        S3ExportS3Key: !Ref S3ExportS3Key
        AccessAnalyzerPollerS3Key: !Ref AccessAnalyzerPollerS3Key
        UpdateFunctionCodeS3Key: !Ref UpdateFunctionCodeS3Key
        CreateTablesLambdaArn: !GetAtt LambdaStack.Outputs.CreateTablesLambdaArn
        ListUsersLambdaArn: !GetAtt LambdaStack.Outputs.ListUsersLambdaArn
        ListGroupsLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupsLambdaArn
        ListGroupMembershipLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupMembershipLambdaArn
        ListPermissionSetsLambdaArn: !GetAtt LambdaStack.Outputs.ListPermissionSetsLambdaArn
        ListProvisionedPermissionSetsLambdaArn: !GetAtt LambdaStack.Outputs.ListProvisionedPermissionSetsLambdaArn
        ListAccountsLambdaArn: !GetAtt LambdaStack.Outputs.ListAccountsLambdaArn
        ListUserAccountAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListUserAccountAssignmentsLambdaArn
        ListGroupAccountAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupAccountAssignmentsLambdaArn
        GetIAMRolesLambdaArn: !GetAtt LambdaStack.Outputs.GetIAMRolesLambdaArn
        ListAccountAccessAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListAccountAccessAssignmentsLambdaArn
        S3ExportLambdaArn: !GetAtt LambdaStack.Outputs.S3ExportLambdaArn
        AccessAnalyzerPollerLambdaArn: !GetAtt LambdaStack.Outputs.AccessAnalyzerPollerLambdaArn
        UpdateFunctionCodeLambdaArn: !GetAtt LambdaStack.Outputs.UpdateFunctionCodeLambdaArn
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # EventBridge Stack
  EventBridgeStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/eventbridge-stack.yaml"
      Parameters:
        S3SourceBucketName: !Ref S3SourceBucketName
        UpdateFunctionCodeLambdaArn: !GetAtt LambdaStack.Outputs.UpdateFunctionCodeLambdaArn
        StackName: !Ref AWS::StackName
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # Step Functions Stack
  StepFunctionsStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/step-functions.yaml"
      Parameters:
        CreateTablesLambdaArn: !GetAtt LambdaStack.Outputs.CreateTablesLambdaArn
        ListUsersLambdaArn: !GetAtt LambdaStack.Outputs.ListUsersLambdaArn
        ListGroupsLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupsLambdaArn
        ListGroupMembershipLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupMembershipLambdaArn
        ListAccountsLambdaArn: !GetAtt LambdaStack.Outputs.ListAccountsLambdaArn
        ListPermissionSetsLambdaArn: !GetAtt LambdaStack.Outputs.ListPermissionSetsLambdaArn
        ListProvisionedPermissionSetsLambdaArn: !GetAtt LambdaStack.Outputs.ListProvisionedPermissionSetsLambdaArn
        ListUserAccountAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListUserAccountAssignmentsLambdaArn
        ListGroupAccountAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListGroupAccountAssignmentsLambdaArn
        GetIAMRolesLambdaArn: !GetAtt LambdaStack.Outputs.GetIAMRolesLambdaArn
        GetTrustPoliciesLambdaArn: !GetAtt LambdaStack.Outputs.GetTrustPoliciesLambdaArn
        ListAccountAccessAssignmentsLambdaArn: !GetAtt LambdaStack.Outputs.ListAccountAccessAssignmentsLambdaArn
        EnableDataCollectionScheduling: !Ref EnableDataCollectionScheduling
        DataCollectionScheduleExpression: !Ref DataCollectionScheduleExpression
        DataCollectionScheduleDescription: !Ref DataCollectionScheduleDescription
        DataCollectionScheduleTimezone: !Ref DataCollectionScheduleTimezone
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # Access Analyzer State Machine Stack - polls IAM Access Analyzer findings
  # on its own schedule, independent of AriaStateMachine's identity data
  # collection cadence in StepFunctionsStack above.
  AccessAnalyzerStateMachineStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/access-analyzer-state-machine.yaml"
      Parameters:
        AccessAnalyzerPollerLambdaArn: !GetAtt LambdaStack.Outputs.AccessAnalyzerPollerLambdaArn
        AccessAnalyzerUnusedDispatcherLambdaArn: !GetAtt LambdaStack.Outputs.AccessAnalyzerUnusedDispatcherLambdaArn
        AriaSetupStackName: !Ref AWS::StackName
        EnableAccessAnalyzerScheduling: !Ref EnableAccessAnalyzerScheduling
        AccessAnalyzerScheduleExpression: !Ref AccessAnalyzerScheduleExpression
        AccessAnalyzerScheduleDescription: !Ref AccessAnalyzerScheduleDescription
        AccessAnalyzerScheduleTimezone: !Ref AccessAnalyzerScheduleTimezone
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # Neptune Analytics Stack
  NeptuneAnalyticsStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployNeptune
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/neptune-analytics.yaml"
      Parameters:
        AriaSetupStackName: !Ref AWS::StackName
        S3ExportBucketName: !Ref S3ExportBucketName
        AriaStateMachineArn: !GetAtt StepFunctionsStack.Outputs.StateMachineArn
        GraphName: !Ref GraphName
        PublicIPAddress: !Ref PublicIPAddress
        EnableGraphExportScheduling: !Ref EnableScheduling
        GraphExportScheduleExpression: !Ref ScheduleExpression
        GraphExportScheduleDescription: !Ref ScheduleDescription
        GraphExportScheduleTimezone: !Ref ScheduleTimezone
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # Neptune Notebook Stack
  NeptuneNotebookStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployNeptuneNotebook
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/neptune-notebook.yaml"
      Parameters:
        NotebookInstanceType: !Ref NotebookInstanceType
        NotebookName: !Ref NotebookName
        GraphPort: "8182"
        GraphVPC: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneVPC
        GraphSubnet: !GetAtt NeptuneAnalyticsStack.Outputs.NeptunePrivateSubnet1
        GraphSecurityGroup: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneAnalyticsSecurityGroup
        NeptuneGraphEndpoint: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphEndpoint
        NeptuneGraphId: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphId
        NeptuneGraphName: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphName
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

  # AgentCore MCP Server Stack (hosts the ARIA-gv MCP server)
  AgentCoreMcpStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployMcpServer
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/agentcore-mcp.yaml"
      Parameters:
        ContainerImageUri: !Ref McpContainerImageUri
        AgentRuntimeName: !Ref McpAgentRuntimeName
        NeptuneVPC: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneVPC
        RuntimeSubnet1AzId: !Ref McpRuntimeSubnet1AzId
        RuntimeSubnet2AzId: !Ref McpRuntimeSubnet2AzId
        NeptuneAnalyticsSecurityGroup: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneAnalyticsSecurityGroup
        NeptuneGraphId: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphId
        NeptuneGraphArn: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphArn
        AccessTokenValidityHours: !Ref McpAccessTokenValidityHours
      Tags:
        - Key: aria
          Value: nested-stack
        - Key: auto-delete
          Value: "no"

Outputs:
  GetIAMRolesLambdaFunctionArn:
    Description: "ARN of the GetIAMRoles Lambda function"
    Value: !GetAtt LambdaStack.Outputs.GetIAMRolesLambdaArn
  GetIAMRolesLambdaFunctionName:
    Description: "Name of the GetIAMRoles Lambda function"
    Value: !GetAtt LambdaStack.Outputs.GetIAMRolesLambdaName
  GetIAMRolesLambdaFunctionExecutionRoleArn:
    Description: ARN of IAM role created for GetIAMRoles Lambda function
    Value: !GetAtt LambdaStack.Outputs.GetIAMRolesLambdaExecutionRoleArn
  GetTrustPoliciesLambdaFunctionExecutionRoleArn:
    Description: ARN of IAM role created for GetTrustPolicies Lambda function
    Value: !GetAtt LambdaStack.Outputs.GetTrustPoliciesLambdaExecutionRoleArn
  AccessAnalyzerPollerLambdaFunctionExecutionRoleArn:
    Description: ARN of IAM role created for the internal and external AccessAnalyzerPoller Lambda function
    Value: !GetAtt LambdaStack.Outputs.AccessAnalyzerPollerLambdaExecutionRoleArn
  AccessAnalyzerUnusedDispatcherLambdaFunctionExecutionRoleArn:
    Description: ARN of IAM role created for the unused IAM-role dispatcher Lambda function
    Value: !GetAtt LambdaStack.Outputs.AccessAnalyzerUnusedDispatcherExecutionRoleArn
  AccessAnalyzerUnusedWorkerLambdaFunctionExecutionRoleArn:
    Description: ARN of IAM role created for the unused IAM-role detail worker Lambda function
    Value: !GetAtt LambdaStack.Outputs.AccessAnalyzerUnusedWorkerExecutionRoleArn
  UnusedRoleWorkQueueArn:
    Description: ARN of the SQS queue holding unused IAM-role detail work
    Value: !GetAtt LambdaStack.Outputs.UnusedRoleWorkQueueArn
  UnusedRoleWorkDLQArn:
    Description: ARN of the SQS dead-letter queue for failed unused IAM-role work
    Value: !GetAtt LambdaStack.Outputs.UnusedRoleWorkDLQArn
  S3ExportLambdaFunctionArn:
    Description: "ARN of the S3Export Lambda function"
    Value: !GetAtt LambdaStack.Outputs.S3ExportLambdaArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-S3ExportLambdaFunctionArn
  S3ExportBucketName:
    Description: "Name of the S3 Export Bucket"
    Value: !Ref S3ExportBucketName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-S3ExportBucketName
  StackName:
    Description: "The stack name"
    Value: !Sub "${AWS::StackName}"
    Export:
      Name: "Aria-setup-stackname"
  NeptuneGraphEndpoint:
    Condition: ShouldDeployNeptune
    Description: "Neptune Analytics Graph Endpoint"
    Value: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphEndpoint
  NeptuneGraphId:
    Condition: ShouldDeployNeptune
    Description: "Neptune Analytics Graph ID"
    Value: !GetAtt NeptuneAnalyticsStack.Outputs.NeptuneGraphId
  NeptuneNotebookURL:
    Condition: ShouldDeployNeptuneNotebook
    Description: "Neptune Analytics Notebook URL"
    Value: !GetAtt NeptuneNotebookStack.Outputs.NeptuneAnalyticsSagemakerNotebook

  # MCP Server (AgentCore) Outputs
  McpRuntimeArn:
    Condition: ShouldDeployMcpServer
    Description: "ARN of the AgentCore Runtime hosting the ARIA-gv MCP server"
    Value: !GetAtt AgentCoreMcpStack.Outputs.McpRuntimeArn
  McpCognitoUserPoolId:
    Condition: ShouldDeployMcpServer
    Description: "Cognito user pool id for MCP inbound JWT auth"
    Value: !GetAtt AgentCoreMcpStack.Outputs.CognitoUserPoolId
  McpCognitoAppClientId:
    Condition: ShouldDeployMcpServer
    Description: "Cognito app client id (client_credentials grant)"
    Value: !GetAtt AgentCoreMcpStack.Outputs.CognitoAppClientId
  McpCognitoTokenEndpoint:
    Condition: ShouldDeployMcpServer
    Description: "OAuth2 token endpoint for obtaining a bearer token"
    Value: !GetAtt AgentCoreMcpStack.Outputs.CognitoTokenEndpoint
  McpScope:
    Condition: ShouldDeployMcpServer
    Description: "OAuth scope to request in the client_credentials grant"
    Value: !GetAtt AgentCoreMcpStack.Outputs.McpScope

  # Graph Export Scheduling Outputs (only available when Neptune is deployed and scheduling is enabled)
  AriaExportGraphStateMachineArn:
    Condition: ShouldDeployNeptune
    Description: "ARN of the AriaExportGraphStateMachine"
    Value: !GetAtt NeptuneAnalyticsStack.Outputs.AriaExportGraphStateMachineArn
  GraphExportSchedulingEnabled:
    Condition: ShouldDeployNeptune
    Description: "Whether scheduling is enabled for the AriaExportGraphStateMachine"
    Value: !GetAtt NeptuneAnalyticsStack.Outputs.GraphExportSchedulingEnabled
  GraphExportScheduleExpression:
    Condition: ShouldDeployNeptuneWithScheduling
    Description: "Schedule expression for the AriaExportGraphStateMachine (if enabled)"
    Value: !Ref ScheduleExpression

  GraphExportTriggerRule:
    Condition: ShouldDeployNeptuneWithScheduling
    Description: "EventBridge Rule that triggers graph export after data collection completes"
    Value: !GetAtt NeptuneAnalyticsStack.Outputs.GraphExportTriggerRuleName

  # Data Collection Scheduling Outputs
  AriaStateMachineArn:
    Description: "ARN of the AriaStateMachine for data collection"
    Value: !GetAtt StepFunctionsStack.Outputs.StateMachineArn
  DataCollectionSchedulingEnabled:
    Description: "Whether scheduling is enabled for the AriaStateMachine data collection"
    Value: !GetAtt StepFunctionsStack.Outputs.DataCollectionSchedulingEnabled
  DataCollectionScheduleExpression:
    Description: "Schedule expression for the AriaStateMachine data collection (if enabled)"
    Value: !Ref DataCollectionScheduleExpression

  # Access Analyzer Scheduling Outputs
  AriaAccessAnalyzerStateMachineArn:
    Description: "ARN of the AriaAccessAnalyzerStateMachine for Access Analyzer polling"
    Value: !GetAtt AccessAnalyzerStateMachineStack.Outputs.AccessAnalyzerStateMachineArn
  AccessAnalyzerSchedulingEnabled:
    Description: "Whether scheduling is enabled for the AriaAccessAnalyzerStateMachine"
    Value: !GetAtt AccessAnalyzerStateMachineStack.Outputs.AccessAnalyzerSchedulingEnabled
  AccessAnalyzerScheduleExpression:
    Description: "Schedule expression for the AriaAccessAnalyzerStateMachine (if enabled)"
    Value: !Ref AccessAnalyzerScheduleExpression
